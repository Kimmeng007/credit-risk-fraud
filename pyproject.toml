[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-fraud"
version = "0.1.0"
description = "On-premise-style Spark, HDFS, Oracle, and classical ML pipeline for credit risk and fraud detection"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "pyarrow>=14",
  "scipy>=1.11",
  "lightgbm>=4.7",
  "shap>=0.45",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
oracle = ["oracledb>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["src"]